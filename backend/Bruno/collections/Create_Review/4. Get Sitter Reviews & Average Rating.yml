info:
  name: 4. Get Sitter Reviews & Average Rating
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/api/sitters/{{sitterID}}/reviews"

assert:
  - expr: res.status
    operator: eq
    value: 200
  - expr: res.body.status
    operator: eq
    value: success
  - expr: res.body.data.sitterId
    operator: isDefined
  - expr: res.body.data.averageRating
    operator: isDefined
  - expr: res.body.data.reviewCount
    operator: isGreaterThan
    value: 0
  - expr: res.body.data.reviews
    operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
