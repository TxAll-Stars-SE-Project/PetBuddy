info:
  name: 6. Not Booking Owner (Should Fail 403)
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/reviews"
  body:
    type: json
    data: |-
      {
        "bookingId": 999999,
        "rating": 5,
        "comment": "พยายามแอบรีวิวการจองของคนอื่น"
      }
  auth:
    type: bearer
    token: "{{Owner_Token}}"

assert:
  - expr: res.status
    operator: in
    value: [403, 404]
  - expr: res.body.status
    operator: eq
    value: error

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
